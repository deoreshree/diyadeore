<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FRAUD | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 0%, #12254a 0%, #071226 45%, #040b18 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Background glow */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: rgba(0, 102, 255, 0.10);
            filter: blur(100px);
            border-radius: 50%;
            top: -180px;
            left: -150px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: rgba(0, 102, 255, 0.08);
            filter: blur(100px);
            border-radius: 50%;
            bottom: -180px;
            right: -150px;
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .shield {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;

            background: linear-gradient(145deg, #1683ff, #0751d9);
            border: 1px solid rgba(90, 170, 255, 0.8);
            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;

            box-shadow:
                0 0 25px rgba(0, 110, 255, 0.35),
                inset 0 0 20px rgba(255,255,255,0.08);
        }

        .brand h1 {
            font-size: 28px;
            letter-spacing: 0.5px;
            font-weight: 800;
        }

        .brand p {
            margin-top: 5px;
            color: #7e91b2;
            font-size: 13px;
        }

        .login-card {
            background: rgba(9, 21, 42, 0.92);
            border: 1px solid #243b62;
            border-radius: 14px;
            padding: 32px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.03);
        }

        .login-title {
            margin-bottom: 5px;
            font-size: 22px;
        }

        .login-subtitle {
            color: #7e91b2;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #d8e2f3;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 48px;

            background: #0c1b34;
            border: 1px solid #263d62;
            border-radius: 8px;

            padding: 0 14px;
            color: white;
            font-size: 14px;
            outline: none;

            transition: 0.2s;
        }

        input::placeholder {
            color: #607492;
        }

        input:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 3px rgba(22,119,255,0.12);
        }

        .login-btn {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 8px;

            background: linear-gradient(135deg, #0877ff, #1559d8);
            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
            margin-top: 5px;

            box-shadow: 0 8px 22px rgba(0, 100, 255, 0.25);
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(0, 100, 255, 0.35);
        }

        .error {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: #ff7777;

            padding: 11px 13px;
            border-radius: 7px;

            text-align: center;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .security-status {
            margin-top: 22px;
            padding: 12px;

            background: #07172d;
            border: 1px solid #1d3458;
            border-radius: 8px;

            display: flex;
            align-items: center;
            gap: 9px;

            color: #8fa3c2;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #20df7f;
            border-radius: 50%;
            box-shadow: 0 0 8px #20df7f;
        }

        .footer {
            text-align: center;
            color: #506583;
            font-size: 11px;
            margin-top: 22px;
        }

        @media (max-width: 500px) {
            .login-wrapper {
                padding: 18px;
            }

            .login-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <!-- BRAND -->
        <div class="brand">

            <div class="shield">
                🛡️
            </div>

            <h1>AI FRAUD</h1>

            <p>Banking Security</p>

        </div>


        <!-- LOGIN CARD -->
        <div class="login-card">

            <h2 class="login-title">
                Admin Login
            </h2>

            <p class="login-subtitle">
                Secure access to Banking Transaction Fraud Detection
            </p>


            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}


            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit" class="login-btn">
                    Login to Dashboard
                </button>

            </form>


            <div class="security-status">

                <span class="status-dot"></span>

                <span>
                    Secure Admin Access • AI System Online
                </span>

            </div>

        </div>


        <div class="footer">
            AI Powered Transaction Security System
        </div>

    </div>

</body>
</html>
